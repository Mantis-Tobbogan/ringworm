name: Feature request
description: Suggest an improvement to the ring, the daemon, or the niri patch
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: |
        Some things are deliberately out of scope: pointer trails, click
        animations, GUI settings apps, and compositors with no cursor-position
        escape hatch. See docs/plan.md.
    validations:
      required: false
